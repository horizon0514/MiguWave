name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go tool mygo build -platform darwin/universal
      - name: Package app
        run: |
          cd build/darwin-universal
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "MiguWave.app/Contents/Info.plist")
          ditto -c -k --sequesterRsrc --keepParent "MiguWave.app" "miguwave-${version}-macos-universal.zip"
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/darwin-universal/*.dmg
            build/darwin-universal/*.zip
            build/darwin-universal/SHA256SUMS-macos.txt

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go tool mygo build -platform windows/amd64,windows/arm64
      - name: Checksums
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          Get-ChildItem build\windows-*\*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $relative = $_.FullName.Substring($root.Length + 1)
            "$hash  $relative"
          } | Set-Content build\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            build/windows-amd64/*.exe
            build/windows-arm64/*.exe
            build/SHA256SUMS-windows.txt

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
